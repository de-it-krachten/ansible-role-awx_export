---

- name: Set different python interpreter for AWX/Tower
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ awx_python_interpreter }}"
  when: awx_python_interpreter is defined

- name: Asserts
  ansible.builtin.assert:
    that:
      - awx_export_path is defined

- name: Display collection version
  ansible.builtin.debug:
    msg: "awx.awx collection version : {{ lookup('community.general.collection_version', 'awx.awx') }}"
  when: awx_execution_host is defined and awx_execution_host == 'localhost'

- name: Display awxkit version
  ansible.builtin.debug:
    msg: "awxkit version : {{ lookup('pipe', 'awx --version') }}"
  when: awx_execution_host is defined and awx_execution_host == 'localhost'

- name: Create export path
  ansible.builtin.file:
    path: "{{ awx_export_path }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Obtain token
  ansible.builtin.include_tasks:
    file: token.yml

- name: Export all resources
  ansible.builtin.include_tasks:
    file: "{{ awx_resource }}.yml"
  loop: "{{ awx_export_resources }}"
  loop_control:
    loop_var: awx_resource
